name: Test du classement

# Vérifie le classement en ligne (Supabase) : connexion anonyme, envoi d'un score,
# lecture publique, et refus des tricheries. Le joueur de test est supprimé à la fin.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Tester
        run: |
          U=https://lzdbudsjzizsmsynfraa.supabase.co; K=sb_publishable_k9FMA3NPiaLj_ePdxPxRrw_QjRDEIFY
          note() { echo "::notice title=$1::$2"; }
          j() { python3 -c "import sys,json; d=json.load(sys.stdin); print($1)"; }
          # 1) connexion anonyme
          S=$(curl -s -X POST "$U/auth/v1/signup" -H "apikey: $K" -H "Content-Type: application/json" -d '{"data":{}}')
          T=$(echo "$S" | j "d.get('access_token','')"); ID=$(echo "$S" | j "(d.get('user') or {}).get('id','')")
          if [ -z "$T" ]; then note "1 connexion anonyme" "ÉCHEC : $(echo "$S" | head -c 300)"; exit 1; fi
          note "1 connexion anonyme" "OK"
          A="Authorization: Bearer $T"
          code() { curl -s -o /tmp/r -w "%{http_code}" "$@"; }
          # 2) premier envoi (comme l'appli)
          c=$(code -X POST "$U/rest/v1/joueurs?on_conflict=id" -H "apikey: $K" -H "$A" -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates,return=minimal" -d "{\"id\":\"$ID\",\"pseudo\":\"Test Robot\",\"ville\":\"Limeil-Brévannes\",\"ville_id\":\"fr94044\",\"departement\":\"Val-de-Marne|FR\",\"pays\":\"FR\",\"points\":120,\"lieux\":3}")
          note "2 premier envoi" "$c $(head -c 200 /tmp/r)"
          # 3) progression normale
          c=$(code -X POST "$U/rest/v1/joueurs?on_conflict=id" -H "apikey: $K" -H "$A" -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates,return=minimal" -d "{\"id\":\"$ID\",\"pseudo\":\"Test Robot\",\"ville\":\"Limeil-Brévannes\",\"ville_id\":\"fr94044\",\"departement\":\"Val-de-Marne|FR\",\"pays\":\"FR\",\"points\":300,\"lieux\":5}")
          note "3 progression normale" "$c $(head -c 200 /tmp/r)"
          # 4) lecture publique (sans connexion)
          c=$(code "$U/rest/v1/joueurs?select=pseudo,ville,points,lieux&ville_id=eq.fr94044&order=points.desc&limit=5" -H "apikey: $K")
          note "4 lecture publique" "$c $(head -c 300 /tmp/r)"
          # 5) tricheries : chacune doit être refusée
          c=$(code -X PATCH "$U/rest/v1/joueurs?id=eq.$ID" -H "apikey: $K" -H "$A" -H "Content-Type: application/json" -d '{"points":90000,"lieux":6}')
          note "5a +90 000 points d'un coup (doit être refusé)" "$c $(head -c 160 /tmp/r)"
          c=$(code -X PATCH "$U/rest/v1/joueurs?id=eq.$ID" -H "apikey: $K" -H "$A" -H "Content-Type: application/json" -d '{"pseudo":"<script>alert(1)</script>"}')
          note "5b pseudo piégé (doit être refusé)" "$c $(head -c 160 /tmp/r)"
          c=$(code -X POST "$U/rest/v1/joueurs" -H "apikey: $K" -H "$A" -H "Content-Type: application/json" -d '{"id":"00000000-0000-0000-0000-000000000001","pseudo":"Usurpateur","points":10,"lieux":1}')
          note "5c écrire la ligne d'un autre (doit être refusé)" "$c $(head -c 160 /tmp/r)"
          c=$(code -X POST "$U/rest/v1/joueurs" -H "apikey: $K" -H "Content-Type: application/json" -d '{"pseudo":"Anonyme","points":10,"lieux":1}')
          note "5d écrire sans connexion (doit être refusé)" "$c $(head -c 160 /tmp/r)"
          c=$(code -X DELETE "$U/rest/v1/joueurs?id=neq.$ID" -H "apikey: $K" -H "$A")
          note "5e effacer les autres joueurs (doit ne rien effacer)" "$c $(head -c 160 /tmp/r)"
          c=$(code "$U/rest/v1/joueurs?select=heure_debut,gain_heure,updated_at&limit=1" -H "apikey: $K")
          note "5f lire les colonnes internes (doit être refusé)" "$c $(head -c 160 /tmp/r)"
          # 6) état final puis suppression du joueur de test
          c=$(code "$U/rest/v1/joueurs?select=pseudo,points,lieux&id=eq.$ID" -H "apikey: $K")
          note "6 état final (attendu 300 points, 5 lieux)" "$c $(head -c 200 /tmp/r)"
          c=$(code -X DELETE "$U/rest/v1/joueurs?id=eq.$ID" -H "apikey: $K" -H "$A")
          note "7 suppression du joueur de test" "$c"
