name: Test des photos Wikimedia

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: API Wikipédia et tailles de vignettes
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
          S=$(curl -s -A "$UA" -H "Origin: https://monuverse.fr" -D /tmp/h "https://fr.wikipedia.org/api/rest_v1/page/summary/Mus%C3%A9e_Gr%C3%A9vin")
          T=$(echo "$S" | python3 -c "import sys,json; d=json.load(sys.stdin); print((d.get('thumbnail') or {}).get('source',''), (d.get('originalimage') or {}).get('width',''))")
          echo "::notice title=1 résumé Musée Grévin::$T ; CORS=$(grep -i '^access-control-allow-origin' /tmp/h | tr -d '\r')"
          U=$(echo "$T" | cut -d' ' -f1)
          for w in 330 500 640 960; do
            V=$(echo "$U" | sed -E "s#/[0-9]+px-([^/]+)\$#/${w}px-\1#")
            c=$(curl -s -A "$UA" -o /dev/null -w "%{http_code} %{content_type} %{size_download}" -H "Origin: https://monuverse.fr" "$V")
            echo "::notice title=2 vignette ${w}px::$c"
          done
      - name: Le site réel dans un navigateur
        run: |
          pip install -q playwright==1.49.1 && python3 -m playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.py <<'P'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  ctx = await b.new_context(locale='fr-FR', viewport={'width': 390, 'height': 844})
                  pg = await ctx.new_page(); logs = []
                  pg.on('console', lambda m: logs.append(m.type + ' ' + m.text[:160]))
                  pg.on('requestfailed', lambda r: logs.append('ÉCHEC ' + r.url[:120] + ' ' + (r.failure or '')))
                  pg.on('response', lambda r: ('wikimedia' in r.url or 'wikipedia' in r.url) and r.status >= 400 and logs.append(f'HTTP {r.status} {r.url[:140]}'))
                  await pg.goto('https://monuverse.fr/'); await pg.wait_for_timeout(1500)
                  await pg.fill('#w-q', 'paris'); await pg.wait_for_timeout(1500)
                  await pg.click('#w-res [data-i="0"]'); await pg.wait_for_timeout(6000)
                  if await pg.locator('#g-open').count(): await pg.click('#g-open'); await pg.wait_for_timeout(800)
                  await pg.evaluate("()=>closeSheets()"); await pg.wait_for_timeout(6000)
                  n = await pg.evaluate("()=>[document.querySelectorAll('#s-ville [data-wk]').length, document.querySelectorAll('#s-ville img.wk').length, (city()||{}).name, (localStorage.getItem('monuverse-wiki')||'').slice(0,300)]")
                  print('::notice title=3 site réel::lignes avec Wikipédia, photos affichées, ville, cache = ' + str(n).replace('\n',' '))
                  print('::notice title=4 journal::' + ' | '.join(logs[:12]).replace('\n',' ')[:1800])
                  await b.close()
          asyncio.run(main())
          P
          python3 t.py
