name: Données France et outre-mer

# Prépare les lieux de toutes les communes de France, Guadeloupe, Martinique,
# Guyane, La Réunion et Mayotte depuis OpenStreetMap, puis les publie dans data/fr/.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'   # le 1er de chaque mois, 3 h 17 UTC
  push:
    branches: [main]
    paths:
      - 'outils/construire_france.py'
      - 'outils/pages_villes.py'
      - '.github/workflows/donnees-france.yml'

permissions:
  contents: write

concurrency:
  group: donnees-france
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      - name: Outils
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install --quiet --only-binary=:all: shapely==2.0.6

      - name: Télécharger la carte (Geofabrik)
        run: |
          mkdir -p /tmp/osm && cd /tmp/osm
          for z in europe/france europe/france/guadeloupe europe/france/martinique europe/france/guyane europe/france/reunion europe/france/mayotte; do
            f=$(basename $z)-latest.osm.pbf
            curl -fsSL --retry 3 -o "$f" "https://download.geofabrik.de/$z-latest.osm.pbf"
            curl -fsSL --retry 3 -o "$f.md5" "https://download.geofabrik.de/$z-latest.osm.pbf.md5"
            echo "$(cut -d' ' -f1 "$f.md5")  $f" | md5sum -c -   # carte intacte, sinon on s'arrête
          done
          ls -lh

      - name: Construire les fichiers
        run: python3 outils/construire_france.py /tmp/osm data/fr

      - name: Pages Google par commune
        run: python3 outils/pages_villes.py

      - name: Publier
        run: |
          git config user.name "Monuverse"
          git config user.email "noreply@monuverse-app.github.io"
          git add -A data/fr ville sitemap*.xml robots.txt
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -q -m "Données France et outre-mer : mise à jour $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 20; done
          exit 1
